{% extends "base.html" %}
{% block title %}{{ post.title }} · DAMP{% endblock %}
{% block content %}
<p><a class="back-link" href="{{ url_for('public.news') }}">← Alla nyheter</a></p>
<article class="card">
  <h1>{{ post.title }}</h1>
  <p class="article-meta"><time datetime="{{ post.published_at.date().isoformat() }}">{{ post.published_at.date()|long_date }}</time></p>
  <div class="prose">{{ post.body_md|markdown }}</div>
</article>
{% endblock %}
