[project]
name = "damp"
version = "0.1.0"
description = "DAMP poker league: points and standings, built to a static site"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "markdown>=3.7",
    "nh3>=0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
